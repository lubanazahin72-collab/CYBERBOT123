<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Scanner v2.0</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
body{background:#0a0a0a;color:#00ff00;padding:20px}
.container{max-width:1200px;margin:auto}
header{text-align:center;border-bottom:1px solid #00ff00;padding:20px}
h1{text-shadow:0 0 10px #00ff00}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media(max-width:768px){.dashboard{grid-template-columns:1fr}}

.panel{border:1px solid #00aa00;padding:20px;background:rgba(0,20,0,.3)}
label{display:block;margin-bottom:5px}
input{width:100%;padding:10px;background:#001100;border:1px solid #008800;color:#00ff00}
button{margin-top:10px;width:100%;padding:10px;background:#003300;color:#00ff00;border:1px solid #00aa00;cursor:pointer}

.results{margin-top:15px;min-height:80px;padding:10px;border:1px solid #004400}
.status{padding:8px;font-weight:bold}
.safe{color:#00ff00;border-left:5px solid #00ff00}
.warning{color:#ffff00;border-left:5px solid #ffff00}
.danger{color:#ff0000;border-left:5px solid #ff0000}

.terminal{margin-top:30px;border:1px solid #008800;padding:15px;max-height:250px;overflow-y:auto}
.log-time{color:#00aa00}
footer{text-align:center;margin-top:20px;color:#008800}
</style>
</head>

<body>
<div class="container">

<header>
<h1>SECURITY SCANNER v2.0</h1>
</header>

<div class="dashboard">

<!-- PASSWORD PANEL -->
<div class="panel">
<h2>Password Breach Check</h2>
<label>Password</label>
<input type="password" id="password">
<button id="checkPassword">CHECK PASSWORD</button>
<div class="results">
<div id="passwordStatus"></div>
</div>
</div>

<!-- URL PANEL -->
<div class="panel">
<h2>URL Safety Check</h2>
<label>URL</label>
<input type="text" id="url" placeholder="https://example.com">
<button id="checkUrl">CHECK URL</button>
<div class="results">
<div id="urlStatus"></div>
</div>
</div>

</div>

<div class="terminal" id="terminalOutput">
<div><span class="log-time">[System]</span> Scanner initialized</div>
</div>

<footer>Security Scanner © 2025</footer>
</div>

<script>
// ===== COMMON =====
function log(msg){
 const t=new Date().toLocaleTimeString();
 document.getElementById('terminalOutput').innerHTML+=
 `<div><span class="log-time">[${t}]</span> > ${msg}</div>`;
}

function show(id,msg,type){
 const el=document.getElementById(id);
 el.className='status '+type;
 el.innerHTML=msg;
}

// ===== PASSWORD CHECK =====
document.getElementById('checkPassword').onclick=async()=>{
 const pwd=document.getElementById('password').value;
 if(!pwd){show('passwordStatus','⚠ Enter password','warning');return;}

 log('Checking password...');
 try{
 const res=await fetch('/api/check-password-complete/',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({password:pwd})
 });
 const d=await res.json();

 if(res.ok){
  const bad=d.breach.breached;
  show('passwordStatus',
   `Strength: ${d.strength.label}<br>
    Breached: ${bad?`YES (${d.breach.count})`:'NO'}<br>
    Advice: ${d.recommendation}`,
   bad?'danger':'safe'
  );
  log(`Password checked | Breached: ${bad}`);
 }else{
  show('passwordStatus','Server error','danger');
 }
 }catch(e){
  show('passwordStatus','Network error','danger');
 }
};

// ===== URL CHECK =====
document.getElementById('checkUrl').onclick=()=>{
 const input=document.getElementById('url').value.trim();
 if(!input){show('urlStatus','⚠ Enter URL','warning');return;}

 let risk=0, reasons=[];
 try{
  const u=new URL(input);
  const h=u.hostname;

  if(u.protocol!=='https:'){risk++;reasons.push('No HTTPS')}
  if(/^\d+(\.\d+){3}$/.test(h)){risk+=2;reasons.push('IP based URL')}
  if(h.length>30){risk++;reasons.push('Long domain')}
  if(h.split('.').length>4){risk++;reasons.push('Too many subdomains')}
  if(['xyz','tk','ru','click','top'].includes(h.split('.').pop())){
    risk++;reasons.push('Risky TLD');
  }
  if(input.length>75){risk++;reasons.push('Long URL')}
  if(input.includes('@')){risk+=2;reasons.push('@ symbol')}
  if(/\.(exe|apk|bat|zip|js)$/i.test(input)){
    risk+=2;reasons.push('Dangerous file');
  }
  ['verify','free','winner','login','urgent','reward']
  .forEach(w=>{if(input.toLowerCase().includes(w)){risk++;reasons.push(w)}});

  if(risk===0){
   show('urlStatus','✅ SAFE URL','safe');log('Safe URL');
  }else if(risk<=2){
   show('urlStatus','⚠ SUSPICIOUS<br>'+reasons.join('<br>'),'warning');
   log('Suspicious URL');
  }else{
   show('urlStatus','🚨 MALWARE URL<br>'+reasons.join('<br>'),'danger');
   log('Malware URL detected');
  }

 }catch{
  show('urlStatus','❌ Invalid URL','danger');
 }
};
</script>

</body>
</html>
